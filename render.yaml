# Render blueprint for the React frontend (static site).
services:
  - type: web
    name: velora-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # e.g. https://velora-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
